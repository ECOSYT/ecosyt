name: Quality (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable Corepack and pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm exec turbo run lint --filter=!@ecosyt/e2e --filter=!@ecosyt/performance

      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter=!@ecosyt/e2e --filter=!@ecosyt/performance

      - name: Test
        run: pnpm exec turbo run test --filter=!@ecosyt/e2e --filter=!@ecosyt/performance

      - name: Build
        run: pnpm exec turbo run build --filter=!@ecosyt/e2e --filter=!@ecosyt/performance
