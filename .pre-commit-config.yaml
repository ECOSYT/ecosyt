repos:
  - repo: local
    hooks:
      - id: format-check
        name: format check
        entry: pnpm format:check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: lint
        name: lint
        entry: pnpm lint
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: test-quick
        name: quick tests
        entry: pnpm test
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: commitlint
        name: commit message validation
        entry: pnpm exec commitlint --edit
        language: system
        stages: [commit-msg]

      # 🔥 gitleaks version CLI (alignée CI)
      - id: gitleaks
        name: secret scan
        entry: gitleaks detect --source . --redact --no-git
        language: system
        pass_filenames: false
        stages: [pre-commit]
